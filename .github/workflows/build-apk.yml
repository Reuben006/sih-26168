name: Build Standalone Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and bundle web application
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix frontend
          npm run build --prefix frontend
          mkdir -p android/app/src/main/assets
          cp -r frontend/dist/. android/app/src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build and lint debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug lintDebug

      - name: Verify and name APK
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/KinematiX.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify android/app/build/outputs/apk/debug/KinematiX.apk
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          folder = Path('android/app/build/outputs/apk/debug')
          metadata = json.loads((folder / 'output-metadata.json').read_text())
          assert metadata['applicationId'] == 'com.originx.kinematix'
          with zipfile.ZipFile(folder / 'KinematiX.apk') as apk:
              for name in ['assets/index.html', 'assets/speed_model.json', 'assets/benchmark_summary.json']:
                  assert name in apk.namelist(), name
          print('Verified package ID, signature and bundled offline assets.')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KinematiX-debug
          path: android/app/build/outputs/apk/debug/KinematiX.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-lint
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
